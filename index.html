<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 400px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        #result { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Currency Converter</h2>
        <label for="rupees">Enter Amount in Rupees (INR):</label>
        <input type="number" id="rupees" placeholder="e.g. 5000">
        <button onclick="convertCurrency()">Convert</button>
        <div id="result"></div>
    </div>

    <script>
        async function convertCurrency() {
            const rupees = document.getElementById('rupees').value;
            const resultDiv = document.getElementById('result');
            if (!rupees) {
                resultDiv.innerText = "Please enter an amount.";
                return;
            }
            try {
                const response = await fetch(`http://localhost:8080/api/convert?rupees=${rupees}`);
                const data = await response.json();
                resultDiv.innerHTML = `
                    Status: ${data.status}<br>
                    Rupees: ₹${data.inputRupees}<br>
                    Converted USD: $${data.convertedDollars}<br>
                    Rate: ${data.exchangeRateUsed};
            } catch (error) {
                resultDiv.innerText = "Error connecting to server.";
            }
        }
    </script>
</body>
</html>
